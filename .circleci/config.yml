version: 2.1

orbs:
  node: circleci/node@5.2.0

jobs:
  test:
    docker:
      - image: cimg/node:20.16-browsers
    working_directory: ~/project

    steps:
      - checkout

      # Cache node_modules
      - restore_cache:
          keys:
            - v1-deps-{{ arch }}-{{ checksum "package-lock.json" }}
            - v1-deps-{{ arch }}-

      - run:
          name: Install dependencies
          command: npm ci --no-audit --no-fund

      - save_cache:
          key: v1-deps-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - node_modules

      # ===== UI tests (Nightwatch) =====
      - run:
          name: Run UI tests (non-headless via Xvfb, keep HTTP for S3 site)
          command: |
            mkdir -p /tmp/nw-profile
            xvfb-run -a npx nightwatch test/UI \
              --reporter=html --env chrome --open=false --verbose \
              --chrome-arg=--user-data-dir=/tmp/nw-profile \
              --chrome-arg=--no-first-run \
              --chrome-arg=--no-default-browser-check \
              --chrome-arg=--remote-debugging-port=0 \
              --chrome-arg=--disable-dev-shm-usage \
              --chrome-arg=--disable-gpu \
              --chrome-arg=--no-sandbox \
              --chrome-arg=--disable-features=HTTPS-FirstMode,HttpsUpgrades \
              --chrome-arg=--allow-running-insecure-content \
              --chrome-arg=--ignore-certificate-errors \
              --chrome-arg=--unsafely-treat-insecure-origin-as-secure=http://s3-design-sample-site.s3-website-us-west-2.amazonaws.com,http://automationpractice.multiformis.com        # Store UI artifacts (HTML report, screenshots)
      - store_artifacts:
          path: tests_output
          destination: ui-artifacts

      # ===== API tests (Jest) =====
      - run:
          name: Run API tests (Jest)
          command: |
            if npm run -s test:api; then
              echo "API tests passed"
            else
              echo "API tests failed" && exit 1
            fi

      # Publish JUnit XML for CircleCI test summary (from Jest)
      - store_test_results:
          path: reports/api

      # Store API artifacts (HTML report)
      - store_artifacts:
          path: reports/api
          destination: api-reports

workflows:
  version: 2
  ci:
    jobs:
      - test
