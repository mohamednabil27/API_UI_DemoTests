version: 2.1

jobs:
  ui-and-api:
    docker:
      - image: cimg/node:20.16           # primary container (runs npm)
      - image: selenium/standalone-chrome:latest  # service with real Chrome
        environment:
          SE_NODE_MAX_SESSIONS: 1
          SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    working_directory: ~/project
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-deps-{{ arch }}-{{ checksum "package-lock.json" }}
            - v1-deps-{{ arch }}-

      - run:
          name: Install deps
          command: npm ci

      - save_cache:
          key: v1-deps-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - node_modules

      - run:
          name: Run UI tests via remote Selenium (HTTP-friendly flags)
          command: |
            # wait for selenium
            until (curl -s http://localhost:4444/status | grep -q '"ready":true'); do
              echo 'Waiting for Selenium...'; sleep 0.5;
            done
            npx nightwatch test/UI \
              --reporter=html \
              --env chrome \
              --open=false \
              --verbose \
              --webdriver-host=localhost \
              --webdriver-port=4444 \
              --headless \
              --chrome-arg=--disable-features=HTTPS-FirstMode,HttpsUpgrades \
              --chrome-arg=--allow-running-insecure-content \
              --chrome-arg=--ignore-certificate-errors \
              --chrome-arg=--unsafely-treat-insecure-origin-as-secure=http://automationpractice.multiformis.com,http://s3-design-sample-site.s3-website-us-west-2.amazonaws.com

      - store_artifacts:
          path: tests_output
          destination: ui-artifacts

      - run:
          name: Run API tests (Jest)
          command: npm run test:api

      - store_test_results:
          path: reports/api

      - store_artifacts:
          path: reports/api
          destination: api-reports

workflows:
  version: 2
  ci:
    jobs:
      - ui-and-api
