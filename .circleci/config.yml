version: 2.1

orbs:
  node: circleci/node@5.2.0

jobs:
  test:
    docker:
      # Comes with Chrome/Firefox preinstalled, perfect for headless Nightwatch
      - image: cimg/node:20.16-browsers
    working_directory: ~/project

    steps:
      - checkout

      # Cache node_modules
      - restore_cache:
          keys:
            - v1-deps-{{ arch }}-{{ checksum "package-lock.json" }}
            - v1-deps-{{ arch }}-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: v1-deps-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - node_modules

      # ===== UI tests (Nightwatch) =====
      - run:
          name: Run UI tests (Nightwatch)
          command: |
            xvfb-run -a npm run test:ui
            # Use your existing script or direct command (both shown)
            if npm run -s test:ui; then
              echo "UI tests passed"
            else
              echo "UI tests failed" && exit 1
            fi
            

      # Store UI artifacts (HTML report, screenshots)
      - store_artifacts:
          path: reports
          destination: ui-reports

      # ===== API tests (Jest) =====
      - run:
          name: Run API tests (Jest)
          command: |
            # If you used start-server-and-test, this will start mock-user-auth and then run Jest
            if npm run -s test:api; then
              echo "API tests passed"
            else
              echo "API tests failed" && exit 1
            fi

      # Publish JUnit XML for CircleCI test summary (from Jest)
      - store_test_results:
          path: reports/api

      # Store API artifacts (HTML report)
      - store_artifacts:
          path: reports/api
          destination: api-reports

workflows:
  version: 2
  ci:
    jobs:
      - test
